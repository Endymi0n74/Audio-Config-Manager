name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm install

      - name: Frontend syntax check
        run: node --check src/main.js

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy (zéro avertissement)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Tauri app (release)
        run: powershell -ExecutionPolicy Bypass -File build-release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Config-Manager-Windows
          path: dist

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Audio Config Manager.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
